name: Apply habit reminder wiring

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[reminders-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Apply reminder UI and wiring
        run: python3 tool/wire_habit_reminders.py

      - name: Verify
        run: flutter analyze

      - name: Commit applied changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git commit -m "feat: add per-habit reminder UI and scheduling [reminders-applied]"
          git push
